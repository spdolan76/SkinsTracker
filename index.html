<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hiawatha Live Skins Tracker - Secured</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <style>
        /* Smooth transitions for winner highlight animations */
        .skin-winner-cell {
            background-color: #064e3b !important;
            border-color: #10b981 !important;
            color: #ecfdf5 !important;
            animation: pulse-glow 2s infinite alternate;
        }
        @keyframes pulse-glow {
            0% { box-shadow: inset 0 0 4px #10b981; }
            100% { box-shadow: inset 0 0 12px #10b981; }
        }
    </style>
</head>
<body class="bg-slate-900 text-slate-100 font-sans min-h-screen pb-12">

    <!-- Auth Modal Overlay (Visible by default until logged in) -->
    <div id="authOverlay" class="fixed inset-0 z-50 bg-slate-950/90 backdrop-blur-md flex items-center justify-center p-4">
        <div class="bg-slate-800 border border-slate-700 w-full max-w-md rounded-2xl p-6 shadow-2xl">
            <div class="text-center mb-6">
                <h2 id="authTitle" class="text-2xl font-black text-emerald-400">League Login</h2>
                <p id="authSubtitle" class="text-slate-400 text-sm mt-1">Sign in to access the live skins dashboard</p>
            </div>
            
            <form id="authForm" class="space-y-4">
                <div>
                    <label class="block text-xs font-semibold uppercase tracking-wider text-slate-400 mb-1">Email Address</label>
                    <input type="email" id="authEmail" required class="w-full bg-slate-950 border border-slate-700 rounded px-3 py-2.5 text-white focus:outline-none focus:border-emerald-500">
                </div>
                <div>
                    <label class="block text-xs font-semibold uppercase tracking-wider text-slate-400 mb-1">Password</label>
                    <input type="password" id="authPassword" required minlength="6" class="w-full bg-slate-950 border border-slate-700 rounded px-3 py-2.5 text-white focus:outline-none focus:border-emerald-500">
                </div>
                
                <div id="authError" class="text-rose-400 text-xs font-semibold hidden bg-rose-950/30 border border-rose-900/50 p-2 rounded"></div>

                <button type="submit" id="authSubmitBtn" class="w-full bg-emerald-500 hover:bg-emerald-600 text-slate-950 font-bold py-2.5 rounded transition-colors cursor-pointer">
                    Log In
                </button>
            </form>

            <div class="mt-6 pt-4 border-t border-slate-700/60 text-center text-xs text-slate-400">
                <span id="authToggleText">Need an account?</span> 
                <button id="authToggleBtn" type="button" onclick="toggleAuthMode()" class="text-emerald-400 hover:underline font-semibold ml-1 cursor-pointer">Sign Up Instead</button>
            </div>
        </div>
    </div>

    <!-- Live Notification Banner -->
    <div id="notificationBanner" class="fixed top-4 left-1/2 transform -translate-x-1/2 z-50 bg-emerald-500 text-slate-950 font-bold px-4 py-2 rounded-full shadow-2xl opacity-0 pointer-events-none transition-all duration-300 flex items-center gap-2">
        <span id="notificationText">Skin Carded!</span>
    </div>

    <!-- Main App Content (Hidden until authenticated) -->
    <div id="appContent" class="max-w-5xl mx-auto px-4 pt-6 opacity-0 pointer-events-none transition-opacity duration-300">
        <!-- Header -->
        <header class="mb-6 flex flex-col sm:flex-row sm:justify-between sm:items-center border-b border-slate-800 pb-4 gap-4">
            <div class="text-center sm:text-left">
                <h1 class="text-3xl font-extrabold tracking-tight text-emerald-400">The Links at Hiawatha Landing</h1>
                <p class="text-slate-400 text-sm mt-1">Live League Dashboard • White Tees</p>
            </div>
            <div class="flex items-center justify-center gap-3">
                <span id="userDisplay" class="text-xs text-slate-400 bg-slate-800 px-3 py-1.5 rounded-full border border-slate-700"></span>
                <button id="logoutBtn" class="bg-slate-800 hover:bg-slate-700 text-slate-300 hover:text-white px-3 py-1.5 text-xs font-medium rounded-lg border border-slate-700 transition-colors cursor-pointer">
                    Log Out
                </button>
            </div>
        </header>

        <!-- Control & Configuration Board -->
        <section class="bg-slate-800 rounded-xl p-4 mb-6 shadow-xl grid grid-cols-1 sm:grid-cols-2 gap-4 border border-slate-700/60">
            <div>
                <label class="block text-xs font-semibold uppercase tracking-wider text-slate-400 mb-1">Total Round Pot ($)</label>
                <input type="number" id="potPerHole" value="80" class="w-full bg-slate-700 border border-slate-600 rounded px-3 py-2 text-white font-mono font-bold text-lg focus:outline-none focus:border-emerald-500" onchange="sendConfigToFirebase()">
            </div>
            <div>
                <label class="block text-xs font-semibold uppercase tracking-wider text-slate-400 mb-1">League Group Field</label>
                <div class="grid grid-cols-2 gap-2" id="playerInputs">
                    <input type="text" value="Player 1" class="player-name bg-slate-700 border border-slate-600 rounded px-2 py-1.5 text-sm text-white focus:outline-none focus:border-emerald-500" onchange="sendConfigToFirebase()">
                    <input type="text" value="Player 2" class="player-name bg-slate-700 border border-slate-600 rounded px-2 py-1.5 text-sm text-white focus:outline-none focus:border-emerald-500" onchange="sendConfigToFirebase()">
                    <input type="text" value="Player 3" class="player-name bg-slate-700 border border-slate-600 rounded px-2 py-1.5 text-sm text-white focus:outline-none focus:border-emerald-500" onchange="sendConfigToFirebase()">
                    <input type="text" value="Player 4" class="player-name bg-slate-700 border border-slate-600 rounded px-2 py-1.5 text-sm text-white focus:outline-none focus:border-emerald-500" onchange="sendConfigToFirebase()">
                </div>
            </div>
        </section>

        <!-- Scorecard Table Matrix View -->
        <section class="bg-slate-800 rounded-xl shadow-xl overflow-hidden mb-6 border border-slate-700">
            <div class="overflow-x-auto">
                <table class="w-full min-w-[700px] table-fixed border-collapse">
                    <thead>
                        <tr class="bg-slate-750 border-b border-slate-700 text-slate-400">
                            <th class="w-16 p-3 text-left text-xs font-bold uppercase tracking-wider">Hole</th>
                            <th class="w-16 p-3 text-center text-xs font-bold uppercase tracking-wider bg-slate-850/30">Par</th>
                            <th class="w-20 p-3 text-center text-xs font-bold uppercase tracking-wider bg-slate-850/50">Yards</th>
                            <th class="p-3 text-center text-xs font-bold uppercase tracking-wider player-lbl">Player 1</th>
                            <th class="p-3 text-center text-xs font-bold uppercase tracking-wider player-lbl">Player 2</th>
                            <th class="p-3 text-center text-xs font-bold uppercase tracking-wider player-lbl">Player 3</th>
                            <th class="p-3 text-center text-xs font-bold uppercase tracking-wider player-lbl">Player 4</th>
                        </tr>
                    </thead>
                    <tbody id="scorecardBody" class="divide-y divide-slate-700/60">
                        <!-- Populated dynamic matrix -->
                    </tbody>
                </table>
            </div>
        </section>

        <!-- Live Dashboards Panel -->
        <section class="grid grid-cols-1 md:grid-cols-2 gap-6">
            <!-- Payout Ledger Card -->
            <div class="bg-slate-800 rounded-xl p-5 shadow-xl border border-slate-700">
                <h2 class="text-xl font-bold text-slate-200 mb-4 flex justify-between items-center">
                    <span>Skins Split Payout</span>
                    <span class="text-xs bg-emerald-950 text-emerald-400 font-mono px-2.5 py-1 rounded border border-emerald-800" id="totalPotDisplay">Total Pot: $80 (0 Skins)</span>
                </h2>
                <div id="payoutContainer" class="space-y-3">
                    <!-- Dynamic Ledger Target -->
                </div>
            </div>

            <!-- Skin Audit Log Feed Card -->
            <div class="bg-slate-800 rounded-xl p-5 shadow-xl border border-slate-700 flex flex-col">
                <h2 class="text-xl font-bold text-slate-200 mb-4">Live Skins Audit Log</h2>
                <div class="overflow-y-auto max-h-[340px] flex-1 space-y-2 text-sm pr-1" id="analysisLog">
                    <!-- Dynamic Feed Target -->
                </div>
            </div>
        </section>
    </div>

    <!-- Application Script Module Injection -->
    <script type="module" src="app.js"></script>
</body>
</html>
